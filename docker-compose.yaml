services:
  mcp-server-demo:
    image: mcps1:latest
    container_name: mcps1
    depends_on:
      quetionsdb:
        condition: service_healthy
    ports:
    - "8000:8000"
    volumes:
    - .env:/app/.envs
    networks:
    - mcp_network

  quetionsdb:
    image: postgres:16-alpine
    container_name: quetionsdb
    env_file:
      - .env
    ports:
      - 5432:5432
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./data_store:/var/lib/postgresql/data
    networks:
      - mcp_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  mcp_network:
    driver: bridge